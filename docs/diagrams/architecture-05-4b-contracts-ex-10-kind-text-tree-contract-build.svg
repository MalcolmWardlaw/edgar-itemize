e="display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;"><span class="nodeLabel "><p>agenda.chain_restarts: where ARTICLE numbering restarts<br />(chain.restart; chain.section_restart for section-only<br />restarts) and whether a new instrument begins there<br />(seg.instrument_boundary from seg.prior_closed,<br />seg.new_title, seg.new_parties; else chain.restart_unsegmented)</p></span></div></foreignObject></g></g><g class="node default  " id="my-svg-flowchart-chains-3" data-look="neo" transform="translate(160.4765625, 924)"><rect class="basic label-container" style="" x="-96.5703125" y="-96" width="193.140625" height="192"/><g class="label" style="" transform="translate(-80.5703125, -84)"><rect/><foreignObject width="161.140625" height="168"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;"><span class="nodeLabel "><p>one article chain and one section chain per restart<br />(seq.per_segment); the restart candidate heads its chain</p></span></div></foreignObject></g></g><g class="node default  " id="my-svg-flowchart-orphan-4" data-look="neo" transform="translate(160.4765625, 1144)"><rect class="basic label-container" style="" x="-120.4296875" y="-84" width="240.859375" height="168"/><g class="label" style="" transform="translate(-104.4296875, -72)"><rect/><foreignObject width="208.859375" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;"><span class="nodeLabel "><p>a vetoed reference that would have held a chain slot<br />gets a synthetic section for its clauses<br />(gram.synth_section_xref)</p></span></div></foreignObject></g></g><g class="node default  " id="my-svg-flowchart-nodes-5" data-look="neo" transform="translate(160.4765625, 1388)"><rect class="basic label-container" style="" x="-99.0859375" y="-120" width="198.171875" height="240"/><g class="label" style="" transform="translate(-83.0859375, -108)"><rect/><foreignObject width="166.171875" height="216"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;"><span class="nodeLabel "><p>nodes: document root, toc nodes, articles (missing one<br />synthesised: gram.synth_article), sections keyed by<br />(chain, order key) so two ARTICLE 1s never collide</p></span></div></foreignObject></g></g><g class="node default  " id="my-svg-flowchart-clauses-6" data-look="neo" transform="translate(160.4765625, 1728)"><rect class="basic label-container" style="" x="-101.3984375" y="-180" width="202.796875" height="360"/><g class="label" style="" transform="translate(-85.3984375, -168)"><rect/><foreignObject width="170.796875" height="336"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;"><span class="nodeLabel "><p>clauses: sequence.sequence per section span, a Viterbi pass<br />over stack states with deterministic costs (skip, restart,<br />open high, family change): seq.gap*, seq.restart,<br />seq.open_midrun, seq.alt_readings; unplaceable: clause_nonmonotone</p></span></div></foreignObject></g></g><g class="node default  " id="my-svg-flowchart-gaps-7" data-look="neo" transform="translate(160.4765625, 2032)"><rect class="basic label-container" style="" x="-130.0234375" y="-84" width="260.046875" height="168"/><g class="label" style="" transform="translate(-114.0234375, -72)"><rect/><foreignObject width="228.046875" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;"><span class="nodeLabel "><p>clauses outside any section: relief under an article<br />(gram.clause_under_article, gram.synth_section)<br />or clause_outside_section</p></span></div></foreignObject></g></g><g class="node default  " id="my-svg-flowchart-titles-8" data-look="neo" transform="translate(160.4765625, 2240)"><rect class="basic label-container" style="" x="-148.4765625" y="-84" width="296.953125" height="168"/><g class="label" style="" transform="translate(-132.4765625, -72)"><rect/><foreignObject width="264.953125" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;"><span class="nodeLabel "><p>tree_contract.attach_bare_titles: a bare title line above<br />or beside a label becomes the node's title<br />(gram.title_above_label, gram.title_adjacent_line)</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="hsl(0, 0%, 83.3333333333%)" stop-opacity="1"/><stop offset="100%" stop-color="hsl(0, 0%, 88.9215686275%)" stop-opacity="1"/></linearGradient></svg>